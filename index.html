			<script>
				(function() {
					var STORAGE_KEY = 'theme';
					var html = document.documentElement;
					var themeIcons = { system: 'fa-desktop', light: 'fa-sun-o', dark: 'fa-moon-o' };

					function getStoredTheme() {
						try { return localStorage.getItem(STORAGE_KEY) || 'system'; } catch (e) { return 'system'; }
					}
					function setStoredTheme(theme) {
						try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
					}
					function prefersDark() {
						return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					}
					function updateTriggerIcon(theme) {
						var trigger = document.getElementById('theme-trigger');
						if (!trigger) return;
						trigger.className = 'theme-trigger fa ' + (themeIcons[theme] || themeIcons.system);
					}
					var DROPDOWN_DURATION = 200;
					function setDropdownOpen(open) {
						var wrap = document.getElementById('theme-switcher-wrap');
						var dropdown = document.getElementById('theme-dropdown');
						var trigger = document.getElementById('theme-trigger');
						if (!wrap || !dropdown || !trigger) return;
						if (open) {
							dropdown.hidden = false;
							trigger.setAttribute('aria-expanded', 'true');
							requestAnimationFrame(function() {
								wrap.classList.add('is-open');
							});
						} else {
							wrap.classList.remove('is-open');
							trigger.setAttribute('aria-expanded', 'false');
							setTimeout(function() {
								dropdown.hidden = true;
							}, DROPDOWN_DURATION);
						}
					}
					function applyTheme(theme) {
						theme = theme || getStoredTheme();
						html.setAttribute('data-theme', theme);
						updateTriggerIcon(theme);
						document.querySelectorAll('.theme-option').forEach(function(btn) {
							btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
						});
					}
					$(function() {
						applyTheme();
						$(document).on('click', '#theme-trigger', function(e) {
							e.stopPropagation();
							var wrap = document.getElementById('theme-switcher-wrap');
							var isOpen = wrap.classList.contains('is-open');
							setDropdownOpen(!isOpen);
						});
						$(document).on('click', '.theme-option', function() {
							var theme = this.getAttribute('data-theme');
							setStoredTheme(theme);
							applyTheme(theme);
							setDropdownOpen(false);
						});
						$(document).on('click', function() {
							setDropdownOpen(false);
						});
						$(document).on('click', '#theme-switcher-wrap', function(e) {
							e.stopPropagation();
						});
						if (window.matchMedia) {
							window.matchMedia('(prefers-color-scheme: dark)').addListener(function() {
								if (getStoredTheme() === 'system') applyTheme('system');
							});
						}
					});
				})();
			</script>
